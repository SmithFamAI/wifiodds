name: daily data refresh

# Owner: Claude (Cowork), on Jeremy's ruling of 2026-10-06. This workflow is the
# one writer of united/data.json. It runs every morning, pulls the trackers,
# passes every gate in build/ship.sh, commits to main, and Cloudflare Pages
# deploys the push. A flagged measurement fails red and opens an issue; it
# never heals numbers into the site.

on:
  schedule:
    - cron: '10 13 * * *'   # 07:10 Denver in summer, 06:10 in winter
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: 'Collect source evidence only; never refresh, commit, or publish data'
        type: boolean
        required: false
        default: false
      rebaseline_united:
        description: 'One-shot owner ruling, exact pair: "<equipped>/<total>:<ruling text>"'
        required: false
        default: ''
      rebaseline_alaska:
        description: 'One-shot owner ruling, exact pair: "<equipped>/<total>"'
        required: false
        default: ''
      membership_evidence:
        description: 'Fresh FAA observation receipt JSON for the exact October 19 United ruling; no credentials or personal registrant data'
        required: false
        default: ''

concurrency:
  group: daily-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect evidence without changing product data
        run: node build/acquire-refresh-evidence.js
      - name: Retain diagnostic evidence, including failed acquisition receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: refresh-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wifiodds-evidence
          retention-days: 1
          if-no-files-found: error

  refresh:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnostic_only) }}
    # macOS, not Linux: the homepage visual gate renders in WebKit and Chromium
    # and compares against layouts tuned on a Mac. Linux WebKit font metrics
    # failed one of 6,866 checks on the first run (2026-10-06).
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright where the ship gates look for it (~/.wo-respo)
        run: |
          mkdir -p ~/.wo-respo
          cd ~/.wo-respo
          printf '{"name":"wo-respo","private":true,"dependencies":{"playwright":"1.62.0"}}\n' > package.json
          npm install >/dev/null
          npx playwright install chromium webkit

      - name: Refresh, gate, and ship
        env:
          WIFIODDS_DRIVER_ID: github-actions-daily
          WIFIODDS_REBASELINE: ${{ github.event.inputs.rebaseline_united }}
          WIFIODDS_REBASELINE_ALASKA: ${{ github.event.inputs.rebaseline_alaska }}
          WIFIODDS_MEMBERSHIP_EVIDENCE: ${{ github.event.inputs.membership_evidence }}
          GIT_AUTHOR_NAME: wifiodds-daily
          GIT_AUTHOR_EMAIL: daily@wifiodds.com
          GIT_COMMITTER_NAME: wifiodds-daily
          GIT_COMMITTER_EMAIL: daily@wifiodds.com
          RULING_ACTOR: ${{ github.actor }}
        run: |
          # A re-baseline ruling is the owner's alone (review finding 1 on PR 28).
          # Anyone else who dispatches with a ruling gets a plain run: the inputs
          # are dropped and the plausibility gate judges the day as usual.
          if [ -n "$WIFIODDS_REBASELINE$WIFIODDS_REBASELINE_ALASKA" ] && [ "$RULING_ACTOR" != "jeremyinthebay" ]; then
            echo "ruling inputs ignored: dispatched by $RULING_ACTOR, not the owner" | tee refresh.log
            unset WIFIODDS_REBASELINE WIFIODDS_REBASELINE_ALASKA
            unset WIFIODDS_MEMBERSHIP_EVIDENCE
          fi
          [ -n "${WIFIODDS_REBASELINE:-}" ] || unset WIFIODDS_REBASELINE
          [ -n "${WIFIODDS_REBASELINE_ALASKA:-}" ] || unset WIFIODDS_REBASELINE_ALASKA
          bash build/daily-refresh.sh 2>&1 | tee -a refresh.log
          exit "${PIPESTATUS[0]}"

      - name: Confirm current reviewed JSON, API, raw badge, and homepage bodies
        id: confirm_deploy
        env:
          PRIOR_COMMIT: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/wifiodds-deploy-evidence"
          for i in $(seq 1 30); do
            rc=0
            node build/verify-data-deploy.js --require-current --samples 1 \
              --prior-commit "$PRIOR_COMMIT" \
              --evidence-dir "$RUNNER_TEMP/wifiodds-deploy-evidence/attempt-$i" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "current bodies confirmed for $(git rev-parse HEAD)"
              exit 0
            fi
            # Only observed older Pages content is a propagation retry.
            # Authentication denials, changed sources, and other failures stop.
            [ "$rc" -eq 3 ] || exit "$rc"
            sleep 20
          done
          echo "current reviewed bodies were not confirmed within 10 minutes" >&2
          exit 1

      - name: Retain deployment confirmation responses
        if: ${{ always() && steps.confirm_deploy.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-confirm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wifiodds-deploy-evidence
          retention-days: 1
          if-no-files-found: ignore

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 60 refresh.log > tail.txt 2>/dev/null || echo "(no refresh.log)" > tail.txt
          title="daily data refresh failed: $(date -u +%F)"
          # Say what happened, not what probably happened (review finding 2 on PR 28):
          # ship.sh prints "5/5 commit and push" only when it reaches the push, and
          # the post-push confirm step runs after that.
          if grep -q 'SHIP ABORTED' refresh.log 2>/dev/null; then
            state="ship.sh aborted: nothing was committed and nothing was pushed."
          elif grep -q '5/5 commit and push' refresh.log 2>/dev/null; then
            state="ship.sh committed and PUSHED main ($(git rev-parse --short HEAD)); the failure came after the push (deploy confirm or later), so production may already carry today's data."
          else
            state="the run stopped before ship.sh: nothing was committed and nothing was pushed."
          fi
          body=$(printf 'Run: %s\n\nWhat happened: %s\n\nLast 60 lines:\n\n```\n%s\n```\n\nA plausibility flag needs an owner ruling via workflow_dispatch (rebaseline_united / rebaseline_alaska, exact pair only; honored only when dispatched by the owner).\n' \
            "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$state" "$(cat tail.txt)")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label daily-refresh --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create daily-refresh --repo "$GITHUB_REPOSITORY" --color d93f0b --description "unattended daily data refresh" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label daily-refresh --body "$body"
          fi

      - name: Close the failure issue on a green run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label daily-refresh --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Green run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
